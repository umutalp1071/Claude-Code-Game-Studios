name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run GUT Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1

      - name: Install GUT
        # GUT is deliberately not checked into this repo (see tests/README.md) —
        # install it fresh each CI run instead. Pinned to v9.7.1, the first
        # release with explicit Godot 4.7 compatibility fixes (return-type
        # checking change). Bump this tag if GUT cuts a newer 4.7.x-verified
        # release; don't float on a branch — CI must be reproducible.
        run: |
          git clone --depth 1 --branch v9.7.1 https://github.com/bitwes/Gut.git /tmp/gut
          mkdir -p addons
          cp -r /tmp/gut/addons/gut addons/gut

      - name: Import project
        # A fresh checkout has no .godot/ import cache, so no class_name
        # (including GUT's own: GutTest, GutMain, etc.) is registered yet.
        # Without this, gut_cmdln.gd fails at _init() with "Some GUT
        # class_names have not been imported" and exits before running any
        # test -- discovered via an actual CI run on 2026-08-11: the job
        # reported success (exit 0) despite zero tests executing.
        run: godot --headless --import

      - name: Run GUT Tests
        # -ginclude_subdirs is required: -gdir alone does not scan
        # subdirectories, and tests/README.md's own documented layout
        # (tests/unit/[system]/, tests/integration/[system]/) is nested by
        # system. Without this flag the original command would silently
        # discover zero tests in any per-system subfolder.
        #
        # -gprefix=/-gsuffix=_test.gd are required too: GUT's own default
        # is prefix "test_" + suffix ".gd" (i.e. it looks for test_*.gd),
        # but this project's documented file naming
        # (tests/README.md: "[system]_[feature]_test.gd", e.g.
        # ecosystem_moisture_test.gd) is a suffix convention, not GUT's
        # default prefix one. Confirmed via an actual CI run on 2026-08-11
        # that reported success with "Nothing was run" -- GUT started fine
        # but matched zero files under its own defaults.
        run: godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests -ginclude_subdirs=true -gprefix= -gsuffix=_test.gd -gexit

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/
