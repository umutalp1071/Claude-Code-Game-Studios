# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: definition_validity
    status: active
    source: design/gdd/content-data.md
    referenced_by:
      - design/gdd/content-data.md
    variables:
      - moisture_tolerance_min
      - moisture_tolerance_max
      - light_tolerance_min
      - light_tolerance_max
      - footprint_size
      - movement_speed
      - pause_duration_min
      - pause_duration_max
      - growth_rate
      - decay_rate
      - growth_pattern
    output_range: [false, true]
    expression: "SHAPE ONLY, NOT PER-TYPE-SCOPED — see notes: below. (0 <= moisture_tolerance_min < moisture_tolerance_max <= 100) AND (moisture_tolerance_max - moisture_tolerance_min >= 15) AND (0 <= light_tolerance_min < light_tolerance_max <= 100) AND (light_tolerance_max - light_tolerance_min >= 15) AND (0 < footprint_size <= 20) AND (0 <= movement_speed <= 50) AND (0 <= pause_duration_min <= pause_duration_max <= 30) AND (0 <= growth_rate <= 10) AND (0 <= decay_rate <= 10) AND (growth_pattern in {carpet, clump, climb})"
    notes: "Load-time validity check for PlantTypeDef/CreatureTypeDef/ObjectTypeDef.
      A definition failing this check is excluded from the registry at load,
      never crashes startup. moisture_tolerance is an int on the same 0-100
      scale as jar_moisture (ecosystem-simulation.md) — not 0.0-1.0. Each
      definition is checked only against the clauses whose fields exist on
      its own type (e.g. a CreatureTypeDef is never evaluated against
      footprint_size or the moisture/growth/decay/growth_pattern clauses) —
      the shared expression is one formula shape, not one check applied to
      every field regardless of type. See content-data.md Edge Cases and
      Formulas."
    added: 2026-08-03
    revised: "2026-08-03 (rescaled moisture_tolerance from 0.0-1.0 float to
      0-100 int and added band-width/footprint/speed bounds, source:
      content-data.md re-review); 2026-08-03 (added growth_rate/decay_rate
      bounds via new RATE_MAX constant and growth_pattern enum-membership
      clause, source: content-data.md re-review — this entry had fallen out
      of sync with content-data.md's Formulas section until caught in a
      later /design-review pass); 2026-08-03 (added pause_duration_min/max
      bounds via new PAUSE_DURATION_MAX constant, source: content-data.md
      /design-review — new CreatureTypeDef field added to close the Pillar 4
      creature-variety gap; creature-behavior.md still needs a companion
      edit to consume it, tracked in content-data.md Open Questions)"

  - name: drag_active
    status: active
    source: design/gdd/input-abstraction.md
    referenced_by:
      - design/gdd/input-abstraction.md
    variables:
      - press_pos
      - current_pos
      - threshold_mouse
      - threshold_touch
      - device_id
    output_range: [false, true]
    expression: "distance(press_pos, current_pos) > threshold[device_id]"
    notes: "Classifies a pointer gesture as tap vs drag. Strict > (not >=) —
      distance exactly equal to threshold stays a tap. See input-abstraction.md
      Acceptance Criteria #2. press_pos/current_pos are post-stretch logical
      space (get_viewport().get_mouse_position()), not raw window pixels."
    added: 2026-08-03
    revised: "2026-08-03 (added device_id to variables list — it was used in
      the expression but missing from the table, source: input-abstraction.md
      /design-review)"

  - name: placement_validity
    status: active
    source: design/gdd/object-placement.md
    referenced_by:
      - design/gdd/object-placement.md
    variables:
      - px
      - py
      - cx
      - cy
      - rx
      - ry
      - fp
      - fp_a
      - fp_b
      - LENIENCY
    output_range: [false, true]
    expression: "in_bounds AND no_overlap, where in_bounds = ((px-cx)/(rx-fp))^2 + ((py-cy)/(ry-fp))^2 <= 1, no_overlap = dist(pa,pb) >= (fp_a+fp_b) * LENIENCY"
    notes: "Validates a drag-release position for Object Placement. Both
      boundary comparisons are inclusive (<=, >=) — favors the player per
      the Anti-Pillar against punishing mechanics. footprint_size (fp) is a
      float radius in jar-space units, shared definition with content-data.md."
    added: 2026-08-03
    revised: ""

  - name: jar_moisture_tick
    status: active
    source: design/gdd/ecosystem-simulation.md
    referenced_by:
      - design/gdd/ecosystem-simulation.md
    variables:
      - jar_moisture
      - moisture_decay_rate
      - watering_amount
      - watered
    output_range: [0, 100]
    expression: "clamp(jar_moisture - moisture_decay_rate + (watered ? watering_amount : 0), 0, 100)"
    notes: "Global jar-wide moisture update, run once per tick. Anchored to
      the terrarium-concept prototype's validated values (decay=3, water=+25).
      Type: int, 0-100 scale (2026-08-03 /design-review: made explicit here
      after persistence-save.md's save_blob_validity check was found typed
      as float — corrected there to match this int type, the source of
      truth)."
    added: 2026-08-03
    revised: "2026-08-03 (notes: clarified int type, source:
      ecosystem-simulation.md /design-review — fixes a type-drift finding
      against persistence-save.md)"

  - name: light_level_tick
    status: active
    source: design/gdd/ecosystem-simulation.md
    referenced_by:
      - design/gdd/ecosystem-simulation.md
    variables:
      - light_level
      - light_direction
      - LIGHT_STEP_PER_TICK
    output_range: [0, 100]
    expression: "light_level' = clamp(light_level + light_direction * LIGHT_STEP_PER_TICK, 0, 100); light_direction flips sign whenever the clamp triggers (hits 0 or 100), otherwise unchanged"
    notes: "Global jar-wide light update, run once per tick alongside
      jar_moisture — a second variable independent of player action (no
      watering-equivalent input exists for light), added 2026-08-03
      /design-review to fix Core Rule 8's moisture-only possibility-space
      collapse (game-designer + systems-designer findings: one shared
      scalar can't produce depth, and the original staggered moisture bands
      mathematically collapsed to a lockstep zone at moisture in [65,75]).
      Deterministic triangle-wave, not randomized (creative-director
      explicitly rejected RNG here — would reintroduce the 'random, can't
      tell why' failure mode). Distinct from and unrelated to Time & Drift's
      cosmetic day_night_phase (that stays presentation-only, zero gameplay
      effect, per that GDD's own Core Rule 7 — untouched by this change)."
    added: 2026-08-03
    revised: ""

  - name: growth_stage_delta
    status: active
    source: design/gdd/ecosystem-simulation.md
    referenced_by:
      - design/gdd/ecosystem-simulation.md
    variables:
      - growth_stage
      - growth_rate
      - decay_rate
      - max_stage
      - jar_moisture
      - moisture_tolerance_min
      - moisture_tolerance_max
      - light_level
      - light_tolerance_min
      - light_tolerance_max
    output_range: [0, "max_stage"]
    expression: "three-state, not a single clamp expression (revised 2026-08-04 round 12): moisture_ok = jar_moisture in [moisture_tolerance_min, moisture_tolerance_max]; light_ok = light_level in [light_tolerance_min, light_tolerance_max]. If moisture_ok AND light_ok: clamp(growth_stage + growth_rate, 0, max_stage) [GROWING]. If moisture_ok AND NOT light_ok: growth_stage unchanged [STALLED]. If NOT moisture_ok: clamp(growth_stage - decay_rate, 0, max_stage) [DECAYING, regardless of light_ok]."
    notes: "Per-plant-instance growth/decay update, run once per tick per
      plant. Both range checks are inclusive on both bounds. Light clause
      added 2026-08-03 /design-review (see light_level_tick above) —
      previously moisture-only, was a binary AND-gate (single in_range bool)
      through round 11. Revised 2026-08-04 round 12: light failing alone now
      STALLS growth instead of decaying it — tracing a full 40-tick
      light_level cycle showed the prior binary formula decay-biased 2 of 3
      MVP plant types (Moss, Fern) even under flawless player moisture care,
      an Anti-Pillar violation. Only moisture failing still decays, regardless
      of light. See ecosystem-simulation.md's round-12 review note for the
      full trace."
    added: 2026-08-03
    revised: "2026-08-04 (round 12: three-state grow/stall/decay redesign,
      source: ecosystem-simulation.md /design-review)"

  - name: ticks_to_apply
    status: active
    source: design/gdd/time-drift.md
    referenced_by:
      - design/gdd/time-drift.md
    variables:
      - elapsed_seconds
      - seconds_per_tick
      - max_catchup_ticks
    output_range: [0, 84]
    expression: "min(floor(elapsed_seconds / seconds_per_tick), max_catchup_ticks)"
    notes: "Converts real elapsed time since last_visit_timestamp into a
      batch tick count, applied atomically to EcosystemSimulation.advance_tick()
      at session start. Calibrated against Ecosystem Simulation's locked
      growth/decay rates — see time-drift.md Formulas for the full
      calibration reasoning and its honest dormancy-convergence limitation."
    added: 2026-08-03
    revised: ""

  - name: day_night_phase
    status: active
    source: design/gdd/time-drift.md
    referenced_by:
      - design/gdd/time-drift.md
      - design/gdd/diorama-rendering.md
    variables:
      - session_elapsed_seconds
      - cycle_duration_seconds
    output_range: [0.0, 1.0]
    expression: "(session_elapsed_seconds mod cycle_duration_seconds) / cycle_duration_seconds"
    notes: "Purely cosmetic day/night lighting phase, zero gameplay effect.
      Decoupled from ecosystem ticks by design."
    added: 2026-08-03
    revised: ""

  - name: save_blob_validity
    status: active
    source: design/gdd/persistence-save.md
    referenced_by:
      - design/gdd/persistence-save.md
    variables:
      - schema_version
      - jar_moisture
      - light_level
      - light_direction
      - growth_stage
      - optimal_hold_ticks
      - state
      - condition_streak_ticks
      - object_position
      - creature_position
    output_range: [false, true]
    expression: "(schema_version == CURRENT_SCHEMA_VERSION) AND (0<=jar_moisture<=100) AND (0<=light_level<=100) AND (light_direction in {-1, +1}) AND (forall plant: 0<=growth_stage<=plant_type.max_stage) AND (forall plant: 0<=optimal_hold_ticks<=OPTIMAL_HOLD_TICKS_MAX) AND (forall creature: state in {PRESENT, ABSENT}) AND (forall creature: 0<=condition_streak_ticks<=CONDITION_STREAK_MAX) AND (position present when state==PRESENT) AND (forall creature where state==PRESENT: creature_position in_bounds per object-placement.md's ellipse check, fp=0) AND (forall type_id referenced: type_id exists in Content Data registry) AND (object_position in_bounds per object-placement.md's ellipse check)"
    notes: "Gates whether a loaded save blob is restored at all. On false,
      the entire blob is discarded (never partial restore) and all systems
      default-initialize, same as the first-session case. Mirrors
      content-data.md's definition_validity pattern. last_visit_timestamp is
      deliberately NOT gated here — time-drift.md's own Edge Cases already
      sanitize an invalid/future timestamp by resetting to 'first session'
      behavior without discarding jar_moisture/growth_stage, which is more
      precise than an all-or-nothing blob discard would be. optimal_hold_ticks
      and condition_streak_ticks (2026-08-04) are per-instance Ecosystem
      Simulation state added under persistence-save.md's new Core Rule 1
      blob-completeness principle, not one-off patches — see that GDD's
      round-11 review note. creature_position reuses object-placement.md's
      in_bounds check with fp=0, mirroring creature-behavior.md's own reuse
      of the same formula for destination sampling."
    added: 2026-08-03
    revised: "2026-08-04 (/design-review on persistence-save.md,
      ecosystem-simulation.md, content-data.md, object-placement.md as a set:
      added light_level/light_direction clauses — persistence-save.md's own
      formula gained these 2026-08-03 but this registry entry was never
      updated, a drift caught by systems-designer; added type_id-reference
      and object_position in_bounds clauses — qa-lead and systems-designer
      independently found the formula didn't gate two things Core Rule 1
      says are saved, despite Edge Cases/AC8 already claiming the type_id
      check existed); 2026-08-04 round 11 (added optimal_hold_ticks,
      condition_streak_ticks, and creature_position/creature_in_bounds
      clauses — game-designer, systems-designer, and qa-lead independently
      found these three fields were carried-across-tick-boundary state or
      an unchecked position with no blob field/validity clause/AC, source:
      persistence-save.md round-11 /design-review)"

