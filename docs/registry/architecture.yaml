# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: inter_system_communication_pattern
    status: active
    api: "Direct typed method calls for commands/queries (caller needs a return value or ordering guarantee); Godot signals for notifications (caller doesn't know/care who's listening)"
    not: "Central event bus / mediator autoload"
    adr: docs/architecture/adr-0002-signal-init-order-snapshot-architecture.md
    reason: "11 MVP systems have well-defined pairwise dependencies (per systems-index.md), not a many-to-many fan-out mesh; an event bus would lose call-site traceability and typed return values for a problem this project doesn't have"
    referenced_by:
      - docs/architecture/adr-0002-signal-init-order-snapshot-architecture.md
    added: 2026-08-10
    revised: ""

  - purpose: session_init_and_save_load_sequencing
    status: active
    api: "SessionBootstrap autoload, LAST in Project Settings autoload load order, drives the 11-step session-start/save-load sequence (architecture.md Data Flow §3/§4) once via direct calls, then does nothing further"
    not: "Ad-hoc ordering via individual autoloads' own _ready() calling into each other"
    adr: docs/architecture/adr-0002-signal-init-order-snapshot-architecture.md
    reason: "The sequence has real cross-system ordering dependencies (a snapshot that must happen between two other systems' _ready(), a step gated on a runtime state transition) that Godot's autoload load-order guarantee alone can't express; must load LAST since it calls into every autoload it sequences, all of which must have already run their own _ready() first"
    referenced_by:
      - docs/architecture/adr-0002-signal-init-order-snapshot-architecture.md
    added: 2026-08-10
    revised: ""

  - purpose: small_shared_state_module_shape
    status: active
    api: "Single autoload holding a Dictionary registry of RefCounted value objects (keyed by id), zero scene-tree nodes of its own"
    not: "Per-object Node2D scripts for state that needs cross-object queries (e.g. pairwise overlap checks)"
    adr: docs/architecture/adr-0003-object-placement-collision-approach.md
    reason: "A single Dictionary in one autoload makes cross-object checks (e.g. Object Placement's pairwise no_overlap) a straight loop instead of needing sibling node references or group lookups; RefCounted (not Resource) fits private, per-frame-mutated runtime state better than Resource's CoW/duplicate/serialization semantics"
    referenced_by:
      - docs/architecture/adr-0003-object-placement-collision-approach.md
    added: 2026-08-10
    revised: ""

  - purpose: testable_pure_formula_placement
    status: active
    api: "Pure/static formula functions live in a separate, non-autoload script (e.g. object_placement_math.gd), referenced by both the owning autoload and unit tests"
    not: "Static funcs bundled inside the autoload script itself"
    adr: docs/architecture/adr-0003-object-placement-collision-approach.md
    reason: "Keeps coding-standards.md's dependency-injection requirement clean — tests call the math script directly with injected values, never loading the autoload's live-registry/signal-connect code just to reach a formula. Reusable pattern for future ADRs with similar pure-formula content (e.g. Ecosystem Simulation's RNG-injected should_trigger_detail())."
    referenced_by:
      - docs/architecture/adr-0003-object-placement-collision-approach.md
      - docs/architecture/adr-0007-creature-behavior-wander-state-machine.md
    added: 2026-08-10
    revised: ""

  - purpose: production_rng_ownership
    status: active
    api: "The consuming system owns a private RandomNumberGenerator (randomize()'d once at _ready(), no public setter), generates the roll internally, then passes it as a parameter into a separate pure/static gate function for the actual decision"
    not: "A dedicated RNG-provider autoload, or an external system supplying the roll as a call parameter"
    adr: docs/architecture/adr-0004-ecosystem-simulation-tick-architecture.md
    reason: "Keeps the gate decision logic unit-testable with literal roll values without coupling an unrelated system (e.g. Time & Drift) to a mechanic it has no stake in, and without requiring the RNG-owning system to call outward (which several systems' Interactions tables explicitly forbid)"
    referenced_by:
      - docs/architecture/adr-0004-ecosystem-simulation-tick-architecture.md
      - docs/architecture/adr-0007-creature-behavior-wander-state-machine.md
    added: 2026-08-10
    revised: ""

  - purpose: web_export_persistence_storage_backend
    status: active
    api: "localStorage via JavaScriptBridge.eval(), single mechanism for both the true-session-end write and the visibilitychange/pagehide-triggered write (the latter executed entirely in pure JS, zero GDScript involvement at hide time). FileAccess/user:// retained only for non-Web (editor/desktop dev) builds, never shipped in the Web persistence path."
    not: "FileAccess/user:// + FS.syncfs() (IDBFS) for Web export — evaluated and rejected; see ADR-0005 Alternatives Considered"
    adr: docs/architecture/adr-0005-persistence-save-web-storage-strategy.md
    reason: "Web Export Spike Gate B evidence (desktop Chrome only): IDBFS without FS.syncfs() showed a real hard-kill failure (2/3), and even with syncfs() it shares the same GDScript-must-run-during-hide dependency as the JS-callback option, which is independently the highest-risk axis for the untested WebKit family. The chosen mechanism removes that dependency from the hide-triggered write entirely by construction, not just by favorable measurement on one browser."
    referenced_by:
      - docs/architecture/adr-0005-persistence-save-web-storage-strategy.md
    added: 2026-08-10
    revised: ""

  - purpose: web_export_session_boundary_detection
    status: active
    api: "Treat every hide event (visibilitychange->hidden or pagehide) as a possible session boundary — update last_visit_timestamp on every hide, not gated on distinguishing a true close from mere backgrounding. Has no mid-session observable effect since the value is only ever read at the next real page load."
    not: "Attempting to detect a 'true close' event specifically (e.g. gating on unload/beforeunload firing) before committing session-boundary state"
    adr: docs/architecture/adr-0006-time-drift-session-lifecycle.md
    reason: "No reliable close-vs-background signal exists on the Web platform in general — a documented Page Lifecycle API characteristic, not an engine-version gap or something further browser testing would resolve. Gating on true-close detection left last_visit_timestamp permanently stale for any session ending via an untrapped OS-level tab kill, the common termination path on mobile. General pattern for this class of problem — any future ADR needing a 'session ended' signal on Web export should reuse this stance rather than re-attempt close detection."
    referenced_by:
      - docs/architecture/adr-0006-time-drift-session-lifecycle.md
    added: 2026-08-10
    revised: ""

  - purpose: autoload_to_scene_node_reference
    status: active
    api: "Explicit self-registration — the scene node calls Autoload.register_x(self) from its own _ready() (which Godot guarantees runs after every autoload's _ready() has already completed)"
    not: "Lazy %UniqueName lookup via get_tree().current_scene from the autoload side"
    adr: docs/architecture/adr-0008-input-gesture-abstraction-web-touch-focus.md
    reason: "A missing/forgotten registration fails loudly (null reference, first use errors) rather than silently resolving to whatever a scene-unique name currently happens to match; matches coding-standards.md's dependency-injection-over-singletons preference"
    referenced_by:
      - docs/architecture/adr-0008-input-gesture-abstraction-web-touch-focus.md
    added: 2026-08-10
    revised: ""

  - purpose: rendering_entity_ownership
    status: active
    api: "Each rendered entity (plant/creature/object instance) is its own scene node + script polling its relevant upstream system's read-only getters directly in _process(); Discovery cue Light2D nodes are created/freed as children of whichever entity is the cue's current target"
    not: "A central DioramaRenderer coordinator autoload polling everything and pushing updates out; a separate pooled CueLightManager for Discovery cue lights"
    adr: docs/architecture/adr-0009-diorama-rendering-light2d-web-strategy.md
    reason: "Extends the leaf-consumer pattern ADR-0003 already established (DioramaRendering polling ObjectPlacement directly) to the rest of the rendering system; the entity roster is small and fixed (a handful of plants/creatures, one object), so a coordinator solves a fan-out problem this project doesn't have, and a target-owned child Light2D gets correct transform inheritance for free from normal scene-tree parenting instead of needing separate pool-positioning logic"
    referenced_by:
      - docs/architecture/adr-0009-diorama-rendering-light2d-web-strategy.md
    added: 2026-08-10
    revised: ""

# Example:
#
# api_decisions:
#   - purpose: physics_raycast
#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # explicitly banned for this purpose
#     adr: docs/architecture/adr-0002-physics-architecture.md
