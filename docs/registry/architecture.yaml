# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: content_data_query
    status: active
    pattern: direct_call
    producer: content-data
    consumers:
      - ecosystem-simulation   # type_id validation, per-plant/creature tuning fields
      - object-placement       # footprint/type lookups
      - creature-behavior      # movement_speed, pause_duration, spawn_conditions
      - diorama-rendering      # visual_stages, growth_pattern
      - persistence-save       # type_id validation on restore
    adr: docs/architecture/adr-0001-content-data-format.md
    signature: "get_definition(id: String) -> Resource"
    referenced_by:
      - docs/architecture/adr-0001-content-data-format.md
    added: 2026-08-10
    revised: ""

  - contract: gesture_input_delivery
    status: active
    pattern: signal
    producer: input-abstraction
    consumers:
      - object-placement   # tap/drag_start/drag_move/drag_end drive repositioning + footprint-tap acknowledgment
      - tending-input       # tap (and possibly drag) drives watering/misting target
    adr: docs/architecture/adr-0008-input-gesture-abstraction-web-touch-focus.md
    signal_signature: "tap(position: Vector2, device_id: int) / drag_start(position: Vector2, device_id: int) / drag_move(position: Vector2, delta: Vector2, device_id: int) / drag_end(position: Vector2, canceled: bool, device_id: int)"
    referenced_by:
      - docs/architecture/adr-0008-input-gesture-abstraction-web-touch-focus.md
      - docs/architecture/adr-0003-object-placement-collision-approach.md   # already consumed this contract before it was formally registered
    added: 2026-08-10
    revised: ""

  - contract: discovery_active_items_query
    status: active
    pattern: direct_call
    producer: discovery-surfacing
    consumers:
      - diorama-rendering   # per-entity scripts poll for their own active cue, if any (ADR-0009)
      - ambient-audio       # polls category + count for the Reactive Layer discovery bed-shift (ADR-0012)
    adr: docs/architecture/adr-0010-discovery-surfacing-reveal-queue-architecture.md
    signature: "get_active_items() -> Array[DiscoveryItem]"
    referenced_by:
      - docs/architecture/adr-0010-discovery-surfacing-reveal-queue-architecture.md
      - docs/architecture/adr-0009-diorama-rendering-light2d-web-strategy.md   # resolves that ADR's provisional assumption
      - docs/architecture/adr-0012-ambient-audio-godot-strategy.md   # second consumer, no change to the contract itself
    added: 2026-08-10
    revised: "2026-08-11"

  - contract: watering_notification
    status: active
    pattern: signal
    producer: ecosystem-simulation
    consumers:
      - ambient-audio       # drives the Reactive Layer watering swell envelope (ADR-0012)
      - diorama-rendering   # drives Watering Substrate Sheen, ADR-0009 Core Rule 11 (previously unspecified trigger)
    adr: docs/architecture/adr-0012-ambient-audio-godot-strategy.md
    signal_signature: "watering_applied (no parameters)"
    referenced_by:
      - docs/architecture/adr-0012-ambient-audio-godot-strategy.md
      - docs/architecture/adr-0004-ecosystem-simulation-tick-architecture.md   # companion-edited to add the signal
      - docs/architecture/adr-0009-diorama-rendering-light2d-web-strategy.md   # cross-reference note, closes its own latent gap
    added: 2026-08-11
    revised: ""

  - contract: save_mirror_refresh_trigger
    status: active
    pattern: direct_call
    producer: persistence-save
    consumers:
      - ambient-audio   # only non-gesture caller so far — see ADR-0005's own anticipated-gap Risk
    adr: docs/architecture/adr-0012-ambient-audio-godot-strategy.md
    signature: "refresh_mirror() -> void"
    referenced_by:
      - docs/architecture/adr-0012-ambient-audio-godot-strategy.md
      - docs/architecture/adr-0005-persistence-save-web-storage-strategy.md   # companion-edited to add the public wrapper
    added: 2026-08-11
    revised: ""

