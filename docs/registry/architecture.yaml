# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: content_data_reference_by_path
    status: active
    description: "Gameplay code must never reference a content type definition
      by its res:// file path. Always look it up by id via
      content-data.get_definition(id)."
    why: "content-data.md Core Rule 1 — path references break the moment a
      .tres file is renamed or moved, and bypass the definition_validity
      load-time gate entirely."
    adr: docs/architecture/adr-0001-content-data-format.md
    added: 2026-08-10

  - pattern: event_bus_mediator
    status: active
    description: "No central event-bus/dispatcher autoload for cross-system
      communication. Use direct method calls for commands/queries and Godot
      signals for notifications instead (see api_decisions:
      inter_system_communication_pattern)."
    why: "11 MVP systems have well-defined pairwise dependencies, not a
      many-to-many fan-out mesh; a bus would lose call-site traceability and
      typed return values for a problem this project doesn't have."
    adr: docs/architecture/adr-0002-signal-init-order-snapshot-architecture.md
    added: 2026-08-10

