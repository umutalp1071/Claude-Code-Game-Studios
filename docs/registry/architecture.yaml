# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 3
last_updated: "2026-08-11"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: content_type_definitions
    status: active
    owner_system: content-data
    adr: docs/architecture/adr-0001-content-data-format.md
    interface: "get_definition(id: String) -> Resource (read-only by convention, null on miss)"
    write_access: content-data-only   # loaded once at startup from .tres files; never mutated at runtime
    referenced_by:
      - docs/architecture/adr-0001-content-data-format.md
    added: 2026-08-10
    revised: ""

  - state: object_position_held_grab_offset
    status: active
    owner_system: object-placement
    adr: docs/architecture/adr-0003-object-placement-collision-approach.md
    interface: "get_position(object_id: String) -> Vector2 (live while held, committed otherwise); is_held(object_id: String) -> bool; is_within_any_footprint(point: Vector2) -> bool (ADR-0011 companion edit, footprint_size now cached per-object internally, never exposed directly); restore(restored_blob: Dictionary) -> void (ADR-0002 companion edit, one-time bootstrap population, called ONLY by SessionBootstrap step 4 — was get_position()/is_held() only). Revised 2026-08-11 (this pass): added is_within_any_footprint() (ADR-0011 companion edit)."
    write_access: object-placement-only   # runtime writes driven entirely by Input Abstraction signals; restore() is one-time bootstrap population, never overlaps the signal-driven path
    referenced_by:
      - docs/architecture/adr-0003-object-placement-collision-approach.md
      - docs/architecture/adr-0002-signal-init-order-snapshot-architecture.md   # SessionBootstrap calls restore() at step 4
      - diorama-rendering.md   # polls from its own _process(), per architecture.md's leaf-consumer pattern
      - tending-input.md       # footprint exclusion (taps on objects don't water)
      - docs/architecture/adr-0007-creature-behavior-wander-state-machine.md   # movement-obstacle footprints
      - docs/architecture/adr-0011-tending-input-watering-router.md   # adds is_within_any_footprint() companion edit
    added: 2026-08-10
    revised: "2026-08-11"

  - state: jar_moisture_light_growth_creature_state
    status: active
    owner_system: ecosystem-simulation
    adr: docs/architecture/adr-0004-ecosystem-simulation-tick-architecture.md
    interface: "get_jar_moisture()/get_light_level()/get_growth_stage(plant_id)/get_creature_state(creature_id) -> CreatureState.Presence/get_last_known_position(creature_id)/get_was_present_during_batch(creature_id)/get_detail_event_fired(plant_id)/get_plant_ids()/get_creature_ids() -> Array[String] (insertion order)/get_watering_amount() -> int (ADR-0011 companion edit, backed by const WATERING_AMOUNT); writes only via apply_watering()/advance_tick()/set_last_known_position()/restore(restored_blob: Dictionary) (ADR-0002 direct-call convention). Revised 2026-08-11 (this pass): added get_watering_amount() (ADR-0011 companion edit — no prior ADR had declared watering_amount as a stored constant). Revised 2026-08-10 (earlier pass): added restore() (ADR-0002 companion edit, one-time bootstrap population, called ONLY by SessionBootstrap step 3). Revised 2026-08-10 (earlier pass): added the four getters (companion edits for Discovery Surfacing's ADR)."
    write_access: ecosystem-simulation-only   # never reaches outward per its own Interactions table guarantee; restore() is an inbound bootstrap call, same direction as apply_watering()/advance_tick()
    referenced_by:
      - docs/architecture/adr-0004-ecosystem-simulation-tick-architecture.md
      - docs/architecture/adr-0002-signal-init-order-snapshot-architecture.md   # SessionBootstrap calls restore() at step 3
      - discovery-surfacing.md
      - diorama-rendering.md
      - persistence-save.md
      - creature-behavior.md
      - docs/architecture/adr-0011-tending-input-watering-router.md   # adds get_watering_amount() companion edit
      - docs/architecture/adr-0012-ambient-audio-godot-strategy.md   # adds watering_applied signal companion edit
    added: 2026-08-10
    revised: "2026-08-11"

  - state: time_drift_session_state
    status: active
    owner_system: time-drift
    adr: docs/architecture/adr-0006-time-drift-session-lifecycle.md
    interface: "get_state() -> SessionState (enum {INACTIVE, CATCHING_UP, ACTIVE}, read-only) / get_day_night_phase() -> float (0.0-1.0, read-only, cosmetic only) / run_catchup_and_activate() -> void (ADR-0002 companion edit, called ONLY by SessionBootstrap steps 6-7 — was get_state()/get_day_night_phase() only)"
    write_access: time-drift-only   # driven by SessionBootstrap's sequencing (ADR-0002) and wall-clock time; no external write API
    referenced_by:
      - docs/architecture/adr-0006-time-drift-session-lifecycle.md
      - docs/architecture/adr-0002-signal-init-order-snapshot-architecture.md   # SessionBootstrap calls run_catchup_and_activate() at steps 6-7
      - creature-behavior.md   # reads CATCHING_UP/ACTIVE to suppress SPAWNING/DEPARTING animation for batch-resolved transitions
      - discovery-surfacing.md   # needs the pre/post-batch snapshot boundary this state machine defines
      - diorama-rendering.md   # reads get_day_night_phase() every frame for cosmetic lighting
    added: 2026-08-10
    revised: "2026-08-10"

  - state: discovery_reveal_queue
    status: active
    owner_system: discovery-surfacing
    adr: docs/architecture/adr-0010-discovery-surfacing-reveal-queue-architecture.md
    interface: "get_active_items() -> Array[DiscoveryItem] (read-only)"
    write_access: discovery-surfacing-only   # driven entirely by its own capture_pre_batch_snapshot()/compute_delta(), called only by SessionBootstrap (ADR-0002)
    referenced_by:
      - docs/architecture/adr-0010-discovery-surfacing-reveal-queue-architecture.md
      - docs/architecture/adr-0009-diorama-rendering-light2d-web-strategy.md
    added: 2026-08-10
    revised: ""

  - state: ambient_volume_muted_setting
    status: active
    owner_system: ambient-audio
    adr: docs/architecture/adr-0012-ambient-audio-godot-strategy.md
    interface: "Runtime authority: set_volume(v: float) -> void / toggle_mute() -> void (ambient-audio-owned, called only by the future mute/volume UI control). Read at session start via a one-shot poll of PersistenceSave.get_restored_blob() on ambient-audio's first _process() call (not _ready() — see ADR-0012 Decision §6 for the autoload-ordering reason). Durable copy lives in persistence-save's blob (Core Rule 1), written via the new refresh_mirror() call (ADR-0012 companion edit to ADR-0005) after every set_volume()/toggle_mute()."
    write_access: ambient-audio-only   # persistence-save stores the durable blob copy but never originates a write to this value itself
    referenced_by:
      - docs/architecture/adr-0012-ambient-audio-godot-strategy.md
      - docs/architecture/adr-0005-persistence-save-web-storage-strategy.md   # durable blob copy, refresh_mirror() companion edit
    added: 2026-08-11
    revised: ""

