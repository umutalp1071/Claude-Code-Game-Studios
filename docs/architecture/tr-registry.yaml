# Technical Requirement ID Registry
#
# PURPOSE: Persistent, stable IDs for every GDD technical requirement.
# Prevents TR-ID renumbering across /architecture-review runs, which would
# break story references.
#
# RULES:
#   - IDs are PERMANENT. Never renumber, never delete (use status: deprecated).
#   - Add new entries only at the END of each system's list.
#   - When a GDD requirement is reworded (same intent): update `requirement`
#     text and add a `revised` date. The ID stays the same.
#   - When a requirement is removed from the GDD: set status: deprecated.
#   - When a requirement is split or replaced: set status: superseded-by with
#     the new TR-ID(s).
#
# WRITTEN BY: /architecture-review (appends new entries, never overwrites)
# READ BY:    /create-stories (embed IDs in stories)
#             /story-done (look up current requirement text at review time)
#             /story-readiness (validate TR-ID exists and is active)
#
# ID FORMAT: TR-[system-slug]-[NNN]
#   system-slug = short slug matching the GDD system name
#   NNN = three-digit zero-padded sequence per system, starting at 001
#
# STATUS VALUES: active | deprecated | superseded-by: TR-[system]-NNN

version: 4
last_updated: "2026-08-11"

# Populated by the first /architecture-review pass (2026-08-10). Only
# requirements explicitly enumerated in an existing ADR's own "GDD
# Requirements Addressed" table are ID-registered so far — the 7 systems
# with no ADR yet (Input Abstraction, Tending Input, Time & Drift,
# Creature Behavior, Persistence/Save, Discovery Surfacing's reveal-queue
# half, Diorama Rendering, Ambient Audio) are NOT yet ID-registered.
# Minting IDs for un-ADR'd requirements now would risk needing to renumber
# once each system's real ADR tightens the requirement wording against an
# actual decision — see architecture-review-2026-08-10.md's Scoping Note.
#
# UPDATED by the second /architecture-review pass (2026-08-10, same date —
# see architecture-review-2026-08-10-2.md). ADR-0005/0006/0007 now exist,
# so Persistence/Save, Time & Drift, and Creature Behavior are ID-registered
# below. Also added TR-crosscutting-003 for the SessionBootstrap
# restore-write-path gap (Conflict 1 in the second-pass report) — this is a
# real, currently-unmet requirement, not a deprecated one. Input Abstraction,
# Tending Input, Discovery Surfacing's reveal-queue half, Diorama Rendering,
# and Ambient Audio remain un-ID-registered — still no ADR for any of them.
#
# UPDATED by the third /architecture-review pass (2026-08-10, same date —
# see architecture-review-2026-08-10-3.md). ADR-0008/0009/0010 now exist, so
# Input Abstraction, Diorama Rendering, and Discovery Surfacing's
# reveal-queue half are ID-registered below (TR-crosscutting-002, the
# snapshot half, was already registered in pass 1). TR-crosscutting-003
# (SessionBootstrap restore-write-path) remains open and unresolved — a
# third consecutive pass confirmed none of its 6 broken method calls were
# fixed. Tending Input and Ambient Audio still have no ADR and remain
# un-ID-registered.
#
# CONFIRMED by the fourth /architecture-review pass (2026-08-11 — see
# architecture-review-2026-08-11.md). No new ADRs were written since pass 3,
# so no new TR-IDs are minted this pass. TR-crosscutting-003's requirement
# text is unchanged (IDs are permanent regardless of resolution status), but
# the underlying gap it names is now RESOLVED — ADR-0002 was revised and
# verified consistent with every downstream ADR's own Key Interfaces. See
# the traceability index for the per-requirement status change. Tending
# Input and Ambient Audio still have no ADR and remain un-ID-registered.
#
# UPDATED by the fifth /architecture-review pass (2026-08-11, same day —
# see architecture-review-2026-08-11-2.md). ADR-0011 (Tending Input) and
# ADR-0012 (Ambient Audio) now exist, closing the last two un-ADR'd MVP
# systems. 13 new TR-IDs minted below: TR-tending-input-001..006 (all
# Covered) and TR-ambient-audio-001..007 (5 Covered, 2 Partial — UI control
# construction deferred to a future /ux-design pass, Gate D verification
# deferred to a future browser test). All five companion-edit claims these
# two ADRs make against ADR-0003/0004/0005/0009 were independently verified
# present in each target ADR's own file — first fully clean companion-edit
# batch in this project's history.

